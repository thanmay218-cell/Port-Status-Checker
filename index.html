<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port Status Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Port Status Checker</h1>
        <p>Check whether a network port is open or closed.</p>

        <div class="form">
            <label>IP Address / Hostname</label>
            <input type="text" id="host" placeholder="Example: example.com">

            <label>Port Number</label>
            <input type="number" id="port" placeholder="Example: 80">

            <button onclick="checkPort()">Check Port</button>
            <button class="clear" onclick="clearResult()">Clear</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
